name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python -m compileall -q .
      - run: if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.venv/*' | grep -q .; then python -m pip install pytest && python -m pytest -q; else echo "Nenhum teste pytest encontrado; verificação de sintaxe concluída."; fi
