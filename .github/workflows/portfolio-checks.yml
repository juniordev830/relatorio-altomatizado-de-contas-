name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python -m compileall -q .
      - run: if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.venv/*' | grep -q .; then python -m pip install pytest && python -m pytest -q; else echo "Nenhum teste pytest encontrado; verificação de sintaxe concluída."; fi
